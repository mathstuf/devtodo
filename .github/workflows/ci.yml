name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy (${{ matrix.features || 'no features' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
          - features: "--features github"
          - features: "--features gitlab"
          - features: "--features forgejo"
          - features: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ matrix.features }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ matrix.features }}-
      - run: cargo clippy ${{ matrix.features }}

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.rustver }}, ${{ matrix.os }}, ${{ matrix.features || 'no features' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — all feature combinations
          - os: ubuntu-latest
            rustver: stable
            features: "--all-features"
          - os: ubuntu-latest
            rustver: stable
            features: ""
          - os: ubuntu-latest
            rustver: nightly
            features: "--all-features"
            allow_failures: true
          # macOS (Apple Silicon) — all-features only
          - os: macos-latest
            rustver: stable
            features: "--all-features"
          # Windows — all-features only
          - os: windows-latest
            rustver: stable
            features: "--all-features"
    continue-on-error: ${{ matrix.allow_failures == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rustver }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.rustver }}-${{ matrix.os }}-${{ matrix.features }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ matrix.rustver }}-${{ matrix.os }}-${{ matrix.features }}-
      - run: cargo build ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }}
