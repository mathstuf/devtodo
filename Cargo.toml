[package]
name = "devtodo"
version = "0.1.0"
edition = "2018"
description = "Synchronize GitHub/GitLab/Forgejo issue and PR statuses into local iCal VTODO files"
repository = "https://github.com/mathstuf/devtodo"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["github", "gitlab", "forgejo", "todo", "ical"]
categories = ["command-line-utilities"]

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }

absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
blanket_clippy_restriction_lints = "allow"
expect_used = "allow"
implicit_return = "allow"
multiple_crate_versions = "allow"
partial_pub_fields = "allow"
pattern_type_mismatch = "allow"
pub_without_shorthand = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"

[features]
default = ["github"]
github = ["graphql_client", "reqwest", "serde_json", "url"]
gitlab = ["dep:gitlab"]
forgejo = ["dep:forgejo-api"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.0", default-features = false, features = ["cargo", "std"] }
derive_builder = "0.20"
directories = "6.0"
env_logger = "0.11"
human-panic = "2.0"
itertools = "0.14"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "0.0.6"
thiserror = "2.0"
uuid = { version = "1.4", features = ["v4"] }
vobject = "0.9"

# github feature
graphql_client = { version = "0.16", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5.4", optional = true }

# gitlab feature
gitlab = { version = "=0.1811.0", optional = true }

# forgejo feature
forgejo-api = { version = "0.10", features = ["sync"], optional = true }
